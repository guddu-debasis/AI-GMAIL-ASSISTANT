version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gmail_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gmail_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gmail_assistant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmail_assistant_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/gmail_assistant
      REDIS_URL: redis://redis:6379/0
      APP_SECRET_KEY: dev_production_secret_key_change_me!
      OAUTH_TOKEN_ENCRYPTION_KEY: dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGV2IQ==
      LOG_LEVEL: INFO
      # Clerk login: set these in your shell or in a .env file next to this compose file
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
